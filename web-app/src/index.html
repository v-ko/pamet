<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pamet</title>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        transition: opacity 300ms ease-out;
      }
      #splash.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      #splash img {
        width: 96px;
        height: 96px;
        animation: splash-pulse 1.8s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        0%, 100% { opacity: 0.4; transform: scale(0.95); }
        50%      { opacity: 1;   transform: scale(1.05); }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <img src="/logo256.png" alt="Pamet" />
    </div>
    <script>
      (function() {
        function killSplash() {
          var s = document.getElementById('splash');
          if (s) { s.classList.add('fade-out'); setTimeout(function() { s.remove(); }, 350); }
        }
        window.addEventListener('error', killSplash);
        window.addEventListener('unhandledrejection', killSplash);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
